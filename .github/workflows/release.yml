name: Release

# Pushing a tag such as v1.2.3 publishes a GitHub release with the archives
# of every platform, their SHA-256 checksums and notes generated from the
# pull requests merged since the previous release.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: Test
        run: go test -race -count=1 ./...
      - name: Build the archives
        env:
          VERSION: ${{ github.ref_name }}
        run: scripts/dist.sh "${VERSION}"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
        run: |
          prerelease=""
          if [[ "${VERSION}" == *-* ]]; then
            prerelease="--prerelease"
          fi
          gh release create "${VERSION}" dist/* --repo "${GITHUB_REPOSITORY}" \
            --title "lazyobs ${VERSION}" --generate-notes --verify-tag ${prerelease}
